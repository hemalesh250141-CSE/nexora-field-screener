name: nexora
description: NEXORA - Offline-first digital companion for authorized field
  narcotics screening and tamper-evident evidence management.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.1
  cupertino_icons: ^1.0.6
  crypto: ^3.0.3
  intl: ^0.19.0
  uuid: ^4.4.0
  collection: ^1.18.0
  path: ^1.9.0
  http: ^1.2.1
  geolocator: ^13.0.2
  latlong2: ^0.9.1
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.0
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/reference_cards/
    - assets/leaflet_map.html